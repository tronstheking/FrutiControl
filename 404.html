<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FrutiControl VE - Redireccionando...</title>
  <script>
    // Unregister any active Service Worker to prevent caching stale main.jsx
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
    // Always redirect to FrutiControl root with hash route preserved
    var hash = window.location.hash || '';
    var targetUrl = window.location.origin + '/FrutiControl/' + hash;
    window.location.replace(targetUrl);
  </script>
</head>
<body style="background:#059669; color:white; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <h2>Cargando FrutiControl VE...</h2>
</body>
</html>
